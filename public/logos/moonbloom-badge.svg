<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="#14342B">
  <defs>
    <path id="arc-top" d="M 49 161 A 82 82 0 1 1 191 161"/>
    <path id="arc-bottom" d="M 24 120 A 96 96 0 0 0 216 120"/>
    <mask id="badge-bloom-center" maskUnits="userSpaceOnUse" x="-24" y="-24" width="48" height="48">
      <rect x="-24" y="-24" width="48" height="48" fill="white"/>
      <circle cx="0" cy="0" r="4.5" fill="black"/>
    </mask>
  </defs>
  <!-- outer stamp ring -->
  <circle cx="120" cy="120" r="112" fill="none" stroke="#14342B" stroke-width="9"/>
  <!-- curved lettering -->
  <text font-family="Archivo" font-weight="700" font-size="22" letter-spacing="3">
    <textPath href="#arc-top" startOffset="50%" text-anchor="middle">moonbloom farm</textPath>
  </text>
  <text font-family="Archivo" font-weight="700" font-size="19" letter-spacing="5">
    <textPath href="#arc-bottom" startOffset="50%" text-anchor="middle">glen ellen, ca</textPath>
  </text>
  <!-- side dots at 3 and 9 o'clock -->
  <circle cx="26" cy="120" r="5"/>
  <circle cx="214" cy="120" r="5"/>
  <!-- crescent-bloom mark, centered -->
  <g transform="translate(72.3 73.7) scale(1.5)">
    <path d="M26 4 A 26 26 0 1 0 26 56 A 33 33 0 0 1 26 4 Z"/>
    <g transform="translate(43.5 40)">
      <g mask="url(#badge-bloom-center)">
        <ellipse cx="0" cy="-11" rx="6" ry="10"/>
        <ellipse cx="0" cy="-11" rx="6" ry="10" transform="rotate(72)"/>
        <ellipse cx="0" cy="-11" rx="6" ry="10" transform="rotate(144)"/>
        <ellipse cx="0" cy="-11" rx="6" ry="10" transform="rotate(216)"/>
        <ellipse cx="0" cy="-11" rx="6" ry="10" transform="rotate(288)"/>
      </g>
    </g>
  </g>
</svg>
